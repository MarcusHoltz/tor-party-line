# Tor Party Line - Distrobox manifest
# Usage: distrobox assemble create --file distrobox.ini
# Docs:  https://distrobox.it/usage/distrobox-assemble/

[partyline-tor]
image=docker.io/marcusholtz/tor-party-line-box:latest
pull=false
replace=false
init=false
root=false
entry=0
# Optional: uncomment to add an application menu entry with its own icon.
#exported_apps=/usr/share/applications/tor-party-line.desktop
exported_bins=/usr/local/bin/tor-party-line.sh
